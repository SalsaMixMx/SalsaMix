<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#7A1F1B">
  <meta name="application-name" content="SalsaMix">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SalsaMix">
  <title>Salsa Mix — Mi Ruta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="auth-root"></div>
<div id="shell">
  <header id="header"></header>
  <main id="app"></main>
  <div id="fab-root"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>
  <script>
    window.firebaseReady = new Promise((resolve, reject) => {
      window.__resolveFirebaseReady = resolve;
      window.__rejectFirebaseReady = reject;
    });
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js');
          registration.update();
        } catch (error) {
          console.warn('No se pudo registrar la PWA:', error);
        }
      });
    }
  </script>
</body>
</html>
